name: SlideBrowser
options:
  bundleIdPrefix: app.slidebrowser
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Fill in your Apple Developer Team ID before archiving for the App Store.
    DEVELOPMENT_TEAM: ""

targets:
  SlideBrowserKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SlideBrowserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slidebrowser.mac.kit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  SlideBrowser:
    type: application
    platform: macOS
    sources:
      - path: Sources/SlideBrowser
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: SlideBrowserKit
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slidebrowser.mac
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/SlideBrowser.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
